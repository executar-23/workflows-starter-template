<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Executar · Árvore Visual</title>
<style>
:root{
  color-scheme: light dark;
  /* Token do calendário (plugins/executar-cop/assets/design-tokens/calendario-light-mode.md): vermelho só para o atual. */
  --bg: light-dark(#f2f2ef,#111111);
  --panel: light-dark(#ffffff,#1a1a1a);
  --text: light-dark(#111111,#f2f2ef);
  --muted: light-dark(#5a5a5a,#b5b5b0);
  --line: light-dark(#e4e4e1,#333333);
  --hover: light-dark(#f7f7f5,#222222);
  --accent:#e31919;
  --accent-soft: light-dark(#fdeaea,rgba(227,25,25,.18));
  --ok: light-dark(#111111,#f2f2ef);
  --warn: light-dark(#5a5a5a,#b5b5b0);
  --future:#8c8c8c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
.app{padding:24px;max-width:1400px;margin:0 auto}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:750}
h1{font-size:28px;line-height:1.15;margin:6px 0 8px}.subtitle{margin:0;max-width:760px;color:var(--muted);line-height:1.5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:10px;padding:10px 13px;min-height:44px;font-weight:700;cursor:pointer}.btn:hover{background:var(--hover)}.btn:focus-visible,.toggle:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.legend span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.atual{background:var(--accent)}.dot.liberado{background:var(--ok)}.dot.dependencia{background:var(--warn)}.dot.futuro{background:transparent;border:1px solid var(--future)}
.viewport{overflow-x:auto;padding-bottom:8px}.tree{min-width:760px;margin:0;padding:0;list-style:none}.tree ul{list-style:none;margin:0;padding-left:30px;position:relative}.tree ul:before{content:"";position:absolute;left:14px;top:0;bottom:14px;border-left:1px solid var(--line)}.tree li{position:relative;margin:4px 0}.tree li:before{content:"";position:absolute;left:-16px;top:21px;width:16px;border-top:1px solid var(--line)}.tree>li:before{display:none}
.node{display:flex;align-items:center;gap:8px;min-height:42px;border-radius:10px;padding:4px 8px 4px 4px;width:max-content;max-width:100%}.node.atual{background:var(--accent-soft);outline:1px solid var(--accent)}
.toggle{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;font-size:17px;flex:0 0 auto}.toggle:hover{background:var(--hover)}.toggle.leaf{cursor:default;opacity:.85}.label{font-size:14px;font-weight:700;white-space:nowrap}.tag{font-size:11px;padding:4px 7px;border-radius:999px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.tag.atual{color:var(--accent);background:var(--accent-soft)}.tag.liberado{color:var(--ok);background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}.tag.dependencia{color:var(--warn);background:var(--hover)}.tag.futuro{color:var(--future);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.note{font-size:12px;color:var(--muted);margin-left:5px;white-space:nowrap}
.status{margin-top:18px;padding:14px 16px;border-left:3px solid var(--text);background:var(--panel);border-radius:0 12px 12px 0;font-size:13px;line-height:1.55;color:var(--muted)}
@media(max-width:640px){.app{padding:16px}h1{font-size:23px}.tree{min-width:700px}}
</style>
</head>
<body>
<main class="app" id="app">
  <section class="topbar">
    <div>
      <div class="eyebrow">Executar · padrão proprietário</div>
      <h1>Árvore Visual</h1>
      <p class="subtitle">Navegação progressiva por ramos. Abra, feche e mergulhe até o nó necessário, mantendo dependências, estados e portas de liberação visíveis.</p>
    </div>
    <div class="toolbar" aria-label="Controles da árvore">
      <button class="btn" id="abrirTudo" type="button">Abrir tudo</button>
      <button class="btn" id="fecharTudo" type="button">Fechar tudo</button>
      <button class="btn" id="irAtual" type="button">Ir para o estado atual</button>
    </div>
  </section>

  <div class="legend" aria-label="Legenda">
    <span><i class="dot atual"></i> Atual</span>
    <span><i class="dot liberado"></i> Liberado</span>
    <span><i class="dot dependencia"></i> Dependência / porta</span>
    <span><i class="dot futuro"></i> Futuro</span>
  </div>

  <div class="viewport"><ul class="tree" id="tree" role="tree"></ul></div>
  <div class="status" id="status" aria-live="polite"><strong>Estado:</strong> carregando árvore.</div>
</main>
<script>
const ARVORE = {
  id:'lancamento-0709', titulo:'EXECUTAR · LANÇAMENTO 07/09', tipo:'pasta', estado:'liberado', aberto:true, filhos:[
    {id:'fila',titulo:'FILA TEMPORAL ÚNICA',tipo:'pasta',estado:'liberado',nota:'cadeia principal',aberto:true,filhos:[
      {id:'d25',titulo:'25/08 · Central de lançamento',tipo:'pasta',estado:'atual',aberto:true,filhos:[
        {id:'d25-rotas',titulo:'Reunir rotas existentes',tipo:'arquivo',estado:'liberado'},
        {id:'d25-ctas',titulo:'Classificar chamadas para ação',tipo:'arquivo',estado:'liberado'},
        {id:'d25-materiais',titulo:'Reunir materiais existentes',tipo:'arquivo',estado:'liberado'},
        {id:'d25-deps',titulo:'Atualizar mapa de dependências',tipo:'arquivo',estado:'dependencia',nota:'depende dos 3 acima'},
        {id:'d25-porta',titulo:'Liberar 26/08',tipo:'porta',estado:'dependencia'}
      ]},
      {id:'d26',titulo:'26/08 · Destinos de conversão',tipo:'pasta',estado:'futuro',filhos:[
        {id:'d26-app',titulo:'Aplicativo → rota + chamada',tipo:'arquivo'},
        {id:'d26-studio',titulo:'Estúdio → rota + formulário',tipo:'arquivo'},
        {id:'d26-loja',titulo:'Loja → rota',tipo:'arquivo'},
        {id:'d26-biblioteca',titulo:'Biblioteca → rota',tipo:'arquivo'},
        {id:'d26-info',titulo:'Infoprodutos → rota',tipo:'arquivo'},
        {id:'d26-brinde',titulo:'Brinde → página + formulário + entrega',tipo:'arquivo'},
        {id:'d26-porta',titulo:'Liberar 27/08',tipo:'porta',estado:'dependencia'}
      ]},
      {id:'d27',titulo:'27/08 · Ofertas e cadastros',tipo:'pasta',estado:'futuro',filhos:[
        {id:'d27-app',titulo:'Aplicativo',tipo:'arquivo'},
        {id:'d27-servicos',titulo:'Serviços / Estúdio',tipo:'arquivo'},
        {id:'d27-fisicos',titulo:'Produtos físicos',tipo:'arquivo'},
        {id:'d27-info',titulo:'Livros digitais + curso',tipo:'arquivo'},
        {id:'d27-hotmart',titulo:'Hotmart',tipo:'arquivo',estado:'dependencia',nota:'externa'},
        {id:'d27-afiliados',titulo:'Afiliados',tipo:'arquivo',estado:'dependencia',nota:'externa'},
        {id:'d27-porta',titulo:'Liberar 28/08',tipo:'porta',estado:'dependencia'}
      ]},
      {id:'d28',titulo:'28/08 · Peça editorial 01',tipo:'pasta',estado:'futuro',filhos:[
        {id:'d28-4e',titulo:'Entender → Estruturar → Executar → Evoluir',tipo:'arquivo'},
        {id:'d28-evid',titulo:'Evidências + referências',tipo:'arquivo'},
        {id:'d28-img',titulo:'Imagem principal + apoios visuais',tipo:'arquivo'},
        {id:'d28-video',titulo:'Vídeo',tipo:'arquivo'},
        {id:'d28-cta',titulo:'Chamada + brinde',tipo:'arquivo'},
        {id:'d28-pub',titulo:'Publicar / agendar / registrar evidência',tipo:'arquivo'}
      ]},
      {id:'d29',titulo:'29/08 · Peça editorial 02',tipo:'pasta',estado:'futuro',nota:'TDAH × gestão de riscos'},
      {id:'d30',titulo:'30/08 · Peça editorial 03',tipo:'pasta',estado:'futuro',nota:'Funções executivas'},
      {id:'d31',titulo:'31/08 · Demonstração do aplicativo',tipo:'pasta',estado:'futuro'},
      {id:'d0109',titulo:'01/09 · Demonstração do Agente 007',tipo:'pasta',estado:'futuro'},
      {id:'d0209',titulo:'02/09 · Mapa-OS + Estúdio',tipo:'pasta',estado:'futuro'},
      {id:'d0309',titulo:'03/09 · Publicação e agenda',tipo:'pasta',estado:'futuro'},
      {id:'d0409',titulo:'04/09 · Teste ponta a ponta',tipo:'pasta',estado:'futuro'},
      {id:'d0509',titulo:'05/09 · Congelamento',tipo:'porta',estado:'futuro',nota:'porta final'},
      {id:'d0609',titulo:'06/09 · Conferência administrativa',tipo:'arquivo',estado:'futuro',nota:'observar'},
      {id:'d0709',titulo:'07/09 · Lançamento',tipo:'arquivo',estado:'futuro',nota:'destino'}
    ]},
    {id:'conversao',titulo:'RAMO DE CONVERSÃO',tipo:'pasta',filhos:[{id:'conversao-cadeia',titulo:'Conteúdo → chamada → destino → conversão → evidência',tipo:'arquivo'}]},
    {id:'editorial',titulo:'RAMO EDITORIAL',tipo:'pasta',filhos:[{id:'editorial-cadeia',titulo:'Peça-mãe → derivações → chamada → publicação → agenda → evidência',tipo:'arquivo'}]},
    {id:'ofertas',titulo:'RAMO DE OFERTAS',tipo:'pasta',filhos:[
      {id:'of-app',titulo:'Aplicativo',tipo:'arquivo'},{id:'of-serv',titulo:'Serviços / Estúdio',tipo:'arquivo'},{id:'of-fis',titulo:'Produtos físicos',tipo:'arquivo'},{id:'of-info',titulo:'Infoprodutos',tipo:'arquivo'},{id:'of-af',titulo:'Afiliados',tipo:'arquivo'}
    ]},
    {id:'confiabilidade',titulo:'RAMO DE CONFIABILIDADE',tipo:'pasta',filhos:[
      {id:'c1',titulo:'Cada dia possui predecessor',tipo:'arquivo'},{id:'c2',titulo:'Cada dia possui resultado observável',tipo:'arquivo'},{id:'c3',titulo:'Cada dia registra evidência',tipo:'arquivo'},{id:'c4',titulo:'Destino existe antes da chamada',tipo:'arquivo'},{id:'c5',titulo:'Congelamento exige bloqueios críticos = zero',tipo:'arquivo'}
    ]},
    {id:'criticos',titulo:'NÓS CRÍTICOS',tipo:'pasta',estado:'dependencia',filhos:[
      {id:'cr-rotas',titulo:'Rotas',tipo:'arquivo',nota:'sem destino, a chamada não fecha'},
      {id:'cr-ext',titulo:'Hotmart / Afiliados',tipo:'arquivo',nota:'dependência externa'},
      {id:'cr-demo',titulo:'Demonstrações',tipo:'arquivo',nota:'dependem de ambiente estável'},
      {id:'cr-freeze',titulo:'05/09',tipo:'arquivo',nota:'porta de congelamento'}
    ]}
  ]
};

const estadoClasse = e => ['atual','liberado','dependencia','futuro'].includes(e) ? e : '';
const iconeFechado = n => n.tipo==='porta' ? '🔒' : '📁';
const iconeAberto = n => n.tipo==='porta' ? '🔓' : '📂';
const iconeFolha = n => n.tipo==='porta' ? '🔓' : '📄';
const root = document.getElementById('tree');
const status = document.getElementById('status');

function criarNo(nivel){
  const li=document.createElement('li'); li.dataset.nodeId=nivel.id;
  const row=document.createElement('div'); row.className='node'+(nivel.estado==='atual'?' atual':'');
  const temFilhos=Array.isArray(nivel.filhos)&&nivel.filhos.length>0;
  const btn=document.createElement('button'); btn.type='button'; btn.className='toggle'+(temFilhos?'':' leaf');
  if(temFilhos){btn.setAttribute('aria-expanded',String(!!nivel.aberto));btn.setAttribute('aria-label',(nivel.aberto?'Fechar ':'Abrir ')+nivel.titulo);btn.textContent=nivel.aberto?iconeAberto(nivel):iconeFechado(nivel);}else{btn.textContent=iconeFolha(nivel);btn.setAttribute('aria-label','Nó final');}
  const label=document.createElement('span'); label.className='label'; label.textContent=nivel.titulo;
  row.append(btn,label);
  const cls=estadoClasse(nivel.estado); if(cls){const tag=document.createElement('span'); tag.className='tag '+cls; tag.textContent=nivel.estado==='dependencia'?'DEPENDÊNCIA':nivel.estado.toUpperCase(); row.append(tag);}
  if(nivel.nota){const note=document.createElement('span');note.className='note';note.textContent=nivel.nota;row.append(note);}
  li.append(row);
  if(temFilhos){const ul=document.createElement('ul');ul.hidden=!nivel.aberto;nivel.filhos.forEach(f=>ul.append(criarNo(f)));li.append(ul);btn.addEventListener('click',()=>{const aberto=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',String(!aberto));ul.hidden=aberto;btn.textContent=!aberto?iconeAberto(nivel):iconeFechado(nivel);btn.setAttribute('aria-label',(!aberto?'Fechar ':'Abrir ')+nivel.titulo);history.replaceState(null,'','#node='+encodeURIComponent(nivel.id));});}
  return li;
}
root.append(criarNo(ARVORE));
function todosBotoes(){return [...document.querySelectorAll('.toggle:not(.leaf)')]}
function setTodos(aberto){todosBotoes().forEach(btn=>{const li=btn.closest('li');const ul=[...li.children].find(e=>e.tagName==='UL');if(!ul)return;btn.setAttribute('aria-expanded',String(aberto));ul.hidden=!aberto;const id=li.dataset.nodeId;const n=achar(ARVORE,id);btn.textContent=aberto?iconeAberto(n):iconeFechado(n);});}
function achar(n,id){if(n.id===id)return n;for(const f of (n.filhos||[])){const r=achar(f,id);if(r)return r;}return null}
function abrirCaminho(id){let alvo=document.querySelector('[data-node-id="'+CSS.escape(id)+'"]');if(!alvo)return;let p=alvo.parentElement;while(p&&p!==root){if(p.tagName==='UL'){p.hidden=false;const pai=p.parentElement;const btn=pai?.querySelector(':scope > .node > .toggle:not(.leaf)');if(btn){btn.setAttribute('aria-expanded','true');const n=achar(ARVORE,pai.dataset.nodeId);btn.textContent=iconeAberto(n);}}p=p.parentElement;}alvo.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});}
document.getElementById('abrirTudo').addEventListener('click',()=>{setTodos(true);status.innerHTML='<strong>Visualização:</strong> todos os ramos estão abertos.'});
document.getElementById('fecharTudo').addEventListener('click',()=>{setTodos(false);abrirCaminho('fila');status.innerHTML='<strong>Visualização:</strong> ramos recolhidos. A fila principal permanece acessível.'});
document.getElementById('irAtual').addEventListener('click',()=>{abrirCaminho('d25');status.innerHTML='<strong>Estado atual:</strong> 25/08 · Central de lançamento.'});
const hash=new URLSearchParams(location.hash.replace(/^#/,''));if(hash.get('node'))abrirCaminho(hash.get('node'));else abrirCaminho('d25');
status.innerHTML='<strong>Estado atual:</strong> 25/08 · Central de lançamento. Abra os ramos para mergulhar nas dependências.';
</script>
</body>
</html>
