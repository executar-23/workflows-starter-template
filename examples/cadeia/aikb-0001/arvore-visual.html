.node{display:flex;align-items:center;gap:8px;min-height:42px;border-radius:10px;padding:4px 8px 4px 4px;width:max-content;max-width:100%}.node.atual{background:var(--accent-soft);outline:1px solid var(--accent)}

const estadoClasse = e => ['atual','liberado','dependencia','futuro'].includes(e) ? e : '';
const iconeFechado = n => n.tipo==='porta' ? '🔒' : '📁';
const iconeAberto = n => n.tipo==='porta' ? '🔓' : '📂';
const iconeFolha = n => n.tipo==='porta' ? '🔓' : '📄';
const root = document.getElementById('tree');
const status = document.getElementById('status');

function criarNo(nivel){
  const li=document.createElement('li'); li.dataset.nodeId=nivel.id;
  const row=document.createElement('div'); row.className='node'+(nivel.estado==='atual'?' atual':'');
  const temFilhos=Array.isArray(nivel.filhos)&&nivel.filhos.length>0;
  const btn=document.createElement('button'); btn.type='button'; btn.className='toggle'+(temFilhos?'':' leaf');
  if(temFilhos){btn.setAttribute('aria-expanded',String(!!nivel.aberto));btn.setAttribute('aria-label',(nivel.aberto?'Fechar ':'Abrir ')+nivel.titulo);btn.textContent=nivel.aberto?iconeAberto(nivel):iconeFechado(nivel);}else{btn.textContent=iconeFolha(nivel);btn.setAttribute('aria-label','Nó final');}
  const label=document.createElement('span'); label.className='label'; label.textContent=nivel.titulo;
  row.append(btn,label);
  const cls=estadoClasse(nivel.estado); if(cls){const tag=document.createElement('span'); tag.className='tag '+cls; tag.textContent=nivel.estado==='dependencia'?'DEPENDÊNCIA':nivel.estado.toUpperCase(); row.append(tag);}
  if(nivel.nota){const note=document.createElement('span');note.className='note';note.textContent=nivel.nota;row.append(note);}
  li.append(row);
  if(temFilhos){const ul=document.createElement('ul');ul.hidden=!nivel.aberto;nivel.filhos.forEach(f=>ul.append(criarNo(f)));li.append(ul);btn.addEventListener('click',()=>{const aberto=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',String(!aberto));ul.hidden=aberto;btn.textContent=!aberto?iconeAberto(nivel):iconeFechado(nivel);btn.setAttribute('aria-label',(!aberto?'Fechar ':'Abrir ')+nivel.titulo);history.replaceState(null,'','#node='+encodeURIComponent(nivel.id));});}
  return li;
}
root.append(criarNo(ARVORE));
function todosBotoes(){return [...document.querySelectorAll('.toggle:not(.leaf)')]}
function setTodos(aberto){todosBotoes().forEach(btn=>{const li=btn.closest('li');const ul=[...li.children].find(e=>e.tagName==='UL');if(!ul)return;btn.setAttribute('aria-expanded',String(aberto));ul.hidden=!aberto;const id=li.dataset.nodeId;const n=achar(ARVORE,id);btn.textContent=aberto?iconeAberto(n):iconeFechado(n);});}
function achar(n,id){if(n.id===id)return n;for(const f of (n.filhos||[])){const r=achar(f,id);if(r)return r;}return null}
function abrirCaminho(id){let alvo=document.querySelector('[data-node-id="'+CSS.escape(id)+'"]');if(!alvo)return;let p=alvo.parentElement;while(p&&p!==root){if(p.tagName==='UL'){p.hidden=false;const pai=p.parentElement;const btn=pai?.querySelector(':scope > .node > .toggle:not(.leaf)');if(btn){btn.setAttribute('aria-expanded','true');const n=achar(ARVORE,pai.dataset.nodeId);btn.textContent=iconeAberto(n);}}p=p.parentElement;}alvo.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});}
document.getElementById('abrirTudo').addEventListener('click',()=>{setTodos(true);status.innerHTML='<strong>Visualização:</strong> todos os ramos estão abertos.'});
document.getElementById('fecharTudo').addEventListener('click',()=>{setTodos(false);abrirCaminho('fila');status.innerHTML='<strong>Visualização:</strong> ramos recolhidos. A fila principal permanece acessível.'});
document.getElementById('irAtual').addEventListener('click',()=>{abrirCaminho('d25');status.innerHTML='<strong>Estado atual:</strong> 25/08 · Central de lançamento.'});
const hash=new URLSearchParams(location.hash.replace(/^#/,''));if(hash.get('node'))abrirCaminho(hash.get('node'));else abrirCaminho('d25');
status.innerHTML='<strong>Estado atual:</strong> 25/08 · Central de lançamento. Abra os ramos para mergulhar nas dependências.';
