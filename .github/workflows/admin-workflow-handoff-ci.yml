name: Admin Workflow Handoff CI

on:
  push:
    branches: [feat/admin-workflow-handoff-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate AI registry
        run: npm run registry:generate

      - name: TypeScript
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
